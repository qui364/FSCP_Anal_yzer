name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Версия в адресах скриптов и стилей (сброс кэша Telegram)
        run: |
          cp -r src _site
          sed -i -E 's#(src|href)="((js|data|vendor)/[^"]+\.js|style\.css)"#\1="\2?v=${{ github.sha }}"#' _site/index.html
          grep -c "?v=${{ github.sha }}" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
